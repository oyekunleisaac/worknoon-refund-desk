name: worknoon-refunds

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refunds
      POSTGRES_USER: refunds
      POSTGRES_PASSWORD: refunds
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunds -d refunds"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: Worknoon Refund Desk
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: refunds
      DB_USERNAME: refunds
      DB_PASSWORD: refunds
      SESSION_DRIVER: array
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-worknoon-admin}
      DEMO_MODE: ${DEMO_MODE:-true}
      REFUND_WINDOW_DAYS: ${REFUND_WINDOW_DAYS:-30}
      REFUND_HUMAN_REVIEW_THRESHOLD: ${REFUND_HUMAN_REVIEW_THRESHOLD:-500}

  web:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
